name: Hybrid CI/CD Pipeline

on:
  push:
    branches:
      - frontend_v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build React Frontend
        env:
          VITE_API_URL: https://everytube.zennin.tech/api/v1
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy Frontend to Nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "frontend/dist"
          target: "/home/azureuser/everytube"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ghcr.io/jay-ahirrao/everytube-api:latest

      - name: Prepare Backend Env Secret (Base64)
        id: encode_env
        if: ${{ secrets.BACKEND_ENV != '' }}
        run: |
          # Safely encode multiline secret into single-line Base64 to prevent shell newline/escaping corruption
          ENCODED_ENV=$(printf '%s' "$BACKEND_ENV" | base64 -w 0)
          echo "b64=$ENCODED_ENV" >> "$GITHUB_OUTPUT"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Deploy Backend Container
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV_B64: ${{ steps.encode_env.outputs.b64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: BACKEND_ENV_B64
          script: |
            # Authenticate Azure VM to GitHub Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest backend image
            docker pull ghcr.io/jay-ahirrao/everytube-api:latest

            # Ensure host directory exists
            mkdir -p /home/azureuser/everytube

            # If GitHub Secret BACKEND_ENV is provided, decode and update /home/azureuser/everytube/.env
            if [ -n "$BACKEND_ENV_B64" ]; then
              echo "$BACKEND_ENV_B64" | base64 -d > /home/azureuser/everytube/.env
              echo "Successfully synced .env from GitHub Secrets (BACKEND_ENV)."
            fi

            # Validate that .env exists and is not empty before starting container
            if [ ! -s /home/azureuser/everytube/.env ]; then
              echo "::error:: /home/azureuser/everytube/.env is missing or empty! Please populate /home/azureuser/everytube/.env on the VM or set the BACKEND_ENV repository secret."
              exit 1
            fi

            # Sanitize CRLF line endings and secure permissions
            sed -i 's/\r$//' /home/azureuser/everytube/.env
            chmod 600 /home/azureuser/everytube/.env
            
            # Stop and remove the old PM2 process (if it exists) and the old container
            pm2 delete everytube-api || true
            docker stop everytube-api || true
            docker rm everytube-api || true
            
            # Start the new container on port 8000 mounting the persistent .env
            docker run -d --restart unless-stopped -p 8000:8000 \
              --env-file /home/azureuser/everytube/.env \
              -v /home/azureuser/everytube/.env:/app/.env \
              --name everytube-api ghcr.io/jay-ahirrao/everytube-api:latest
            
            # Clean up old unused images to save disk space
            docker image prune -f
